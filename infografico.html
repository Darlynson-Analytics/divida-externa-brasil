<title>Dívida externa na margem</title>

<style>
/* Layout: folha de infográfico em colunas — cabeçalho, destaque do conceito amplo com a composição em barra,
   grade de 6 cartões com ícones e minigráficos, e dois painéis analíticos (ranking 12 meses e dívida líquida). */
:root {
  --bg: #f3f5f7; --sheet: #ffffff; --ink: #10233a; --ink-2: #4a5a6c; --ink-3: #7b8796;
  --rule: #dfe4ea; --soft: #eef2f6;
  --deb: #1f4f86; --inter: #0f7d78; --tit: #b0893b; --amp: #10233a; --liq: #8a3f5c;
  --up: #0f7d78; --down: #b4473a; --neg: #0f7d78; --pos: #b0893b;
  --display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c141d; --sheet: #121c27; --ink: #e8edf3; --ink-2: #aeb9c6; --ink-3: #7f8b99;
  --rule: #24313f; --soft: #1a2633;
  --deb: #6a9fd8; --inter: #4fbdb5; --tit: #d9b46a; --amp: #e8edf3; --liq: #d3829f;
  --up: #4fbdb5; --down: #e58676; --neg: #4fbdb5; --pos: #d9b46a; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0c141d; --sheet: #121c27; --ink: #e8edf3; --ink-2: #aeb9c6; --ink-3: #7f8b99;
  --rule: #24313f; --soft: #1a2633;
  --deb: #6a9fd8; --inter: #4fbdb5; --tit: #d9b46a; --amp: #e8edf3; --liq: #d3829f;
  --up: #4fbdb5; --down: #e58676; --neg: #4fbdb5; --pos: #d9b46a; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px; }
.folha { max-width: 1180px; margin: 0 auto; display: grid; gap: 22px; }
.num { font-family: var(--display); font-variant-numeric: tabular-nums; font-stretch: 85%; }

/* Cabeçalho */
.cab { display: grid; grid-template-columns: 1fr auto; gap: 12px 24px; align-items: end; padding-bottom: 18px; border-bottom: 2px solid var(--ink); }
.olho { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; margin: 0 0 6px; }
h1 { font-family: var(--display); font-stretch: 78%; font-weight: 800; font-size: clamp(34px, 5.4vw, 60px); line-height: .95; margin: 0; letter-spacing: -.01em; text-wrap: balance; }
h1 span { color: var(--ink-3); font-weight: 500; }
.selo { text-align: right; display: grid; gap: 2px; }
.selo b { font-family: var(--display); font-stretch: 80%; font-size: 30px; font-weight: 700; line-height: 1; }
.selo small { color: var(--ink-2); font-size: 12.5px; }

/* Destaque */
.destaque { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 26px; display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 34px; }
.dest-num { display: grid; gap: 10px; align-content: start; }
.rotulo { display: flex; gap: 10px; align-items: center; font-weight: 600; font-size: 14px; }
.rotulo .cod { color: var(--ink-3); font-weight: 500; font-size: 12px; }
.ico { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.ico svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.grande { font-size: clamp(56px, 8vw, 84px); font-weight: 700; line-height: .9; letter-spacing: -.01em; }
.grande small { font-size: .3em; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 6px; }
.var2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.var { border-top: 1px solid var(--rule); padding-top: 8px; display: grid; gap: 1px; }
.var .t { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.var .a { font-size: 22px; font-weight: 700; line-height: 1.1; display: flex; align-items: center; gap: 5px; }
.var .p { font-size: 13px; color: var(--ink-2); }
.seta { width: 14px; height: 14px; flex: none; }
.up { color: var(--up); } .down { color: var(--down); }

.comp { display: grid; gap: 14px; align-content: center; min-width: 0; }
.comp h2, .painel h2 { font-family: var(--display); font-stretch: 85%; font-size: 19px; font-weight: 700; margin: 0; text-wrap: balance; }
.comp p.sub, .painel p.sub { margin: -8px 0 0; color: var(--ink-2); font-size: 13px; }
.chave { position: relative; height: 34px; }
.chave .br { position: absolute; top: 18px; height: 12px; border: 1.5px solid var(--ink-3); border-bottom: 0; border-radius: 3px 3px 0 0; }
.chave .tx { position: absolute; top: 0; font-size: 12px; color: var(--ink-2); white-space: nowrap; transform: translateX(-50%); }
.chave .tx b { color: var(--ink); }
.barra { display: flex; height: 56px; border-radius: 4px; overflow: hidden; gap: 2px; }
.barra div { background: var(--c); color: #fff; display: flex; align-items: center; padding-left: 12px; font-family: var(--display); font-stretch: 85%; font-weight: 700; font-size: 20px; min-width: 0; overflow: hidden; white-space: nowrap; }
:root[data-theme="dark"] .barra div { color: #0c141d; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .barra div { color: #0c141d; } }
.leg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.leg div { display: grid; gap: 2px; border-left: 3px solid var(--c); padding-left: 10px; min-width: 0; }
.leg b { font-size: 13px; }
.leg span { font-size: 12.5px; color: var(--ink-2); }

/* Cartões */
.secao { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.secao h2 { font-family: var(--display); font-stretch: 85%; font-size: 22px; font-weight: 700; margin: 0; }
.secao p { margin: 0; color: var(--ink-2); font-size: 13px; }
.grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.cartao { background: var(--sheet); border: 1px solid var(--rule); border-top: 3px solid var(--c); border-radius: 6px; padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.cartao .nome { font-weight: 600; font-size: 14px; line-height: 1.25; }
.cartao .valor { font-size: 44px; font-weight: 700; line-height: 1; }
.cartao .valor small { font-size: 14px; font-weight: 500; color: var(--ink-2); margin-left: 4px; font-family: var(--body); font-stretch: 100%; }
.cartao .valor .rot { display: block; font-family: var(--body); font-stretch: 100%; font-size: 12px; color: var(--ink-3); font-weight: 500; margin-top: 4px; }
.cartao .var .a { font-size: 19px; }
.spark { width: 100%; height: 60px; display: block; overflow: visible; }
.spark-leg { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: -6px; }

/* Painéis */
.duo { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; }
.painel { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 22px; display: grid; gap: 16px; align-content: start; min-width: 0; }
.rank { display: grid; gap: 12px; }
.rank .l { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; align-items: center; }
.rank .l > span { font-size: 13px; font-weight: 600; line-height: 1.2; }
.rank .tr { display: flex; align-items: center; gap: 8px; min-width: 0; }
.rank .b { height: 18px; background: var(--c); border-radius: 0 3px 3px 0; }
.rank .v { font-size: 15px; font-weight: 700; white-space: nowrap; }
.rank .v small { font-family: var(--body); font-stretch: 100%; font-weight: 400; color: var(--ink-2); font-size: 12px; margin-left: 4px; }
.liq svg { width: 100%; height: auto; display: block; }
.liq text { font-family: var(--body); font-size: 11px; fill: var(--ink-3); }
.liq .marco { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.rank + h3 { margin-top: 6px; }
.painel h3 { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin: 0; }
.liq .marco div { display: grid; gap: 1px; }
.liq .marco b { font-size: 24px; font-weight: 700; line-height: 1.1; }
.liq .marco span { font-size: 12px; color: var(--ink-2); }

.notas { border-top: 1px solid var(--rule); padding-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; font-size: 12px; color: var(--ink-2); }
.notas b { color: var(--ink); display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 3px; }
.notas p { margin: 0; }

@media (max-width: 920px) {
  .destaque, .duo { grid-template-columns: minmax(0, 1fr); }
  .grade { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .notas { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .cab { grid-template-columns: minmax(0, 1fr); }
  .selo { text-align: left; }
  .grade, .leg { grid-template-columns: minmax(0, 1fr); }
  .destaque { padding: 18px; }
  .barra div { font-size: 15px; padding-left: 6px; }
  .chave .tx { font-size: 11px; }
  .rank .l { grid-template-columns: 110px minmax(0, 1fr); }
}
</style>

const SETA_UP = '<svg class="seta" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 2 12.5 9h-11z" fill="currentColor"/></svg>';
const SETA_DN = '<svg class="seta" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 12 1.5 5h11z" fill="currentColor"/></svg>';

const fmt = (n, d = 1) => n.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d });
const sg = (n, d = 1) => (n > 0 ? "+" : n < 0 ? "−" : "") + fmt(Math.abs(n), d);
const ico = (s) => `<span class="ico" style="--c:var(--${s.cor})"><svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[s.codigo]}</svg></span>`;
const S = Object.fromEntries(INFO.series.map((s) => [s.codigo, s]));

function variacao(titulo, abs, pct, ref) {
  const cls = abs >= 0 ? "up" : "down";
  const p = pct == null ? "% n.a. (base negativa)" : `${sg(pct)}% · vs. ${ref}`;
  return `<div class="var"><span class="t">${titulo}</span>
    <span class="a num ${cls}">${abs >= 0 ? SETA_UP : SETA_DN}${sg(abs)}<small style="font-size:12px;font-weight:500;color:var(--ink-2);font-family:var(--body);font-stretch:100%">US$ bi</small></span>
    <span class="p">${p}</span></div>`;
}

function spark(s) {
  const h = s.hist, W = 300, H = 60, pad = 4;
  const vals = h.map((p) => p[1]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if (s.codigo === "3685") { lo = Math.min(lo, 0); hi = Math.max(hi, 0); }
  const m = (hi - lo) * 0.08; lo -= m; hi += m;
  const x = (i) => pad + (i * (W - 2 * pad)) / (h.length - 1);
  const y = (v) => H - pad - ((v - lo) * (H - 2 * pad)) / (hi - lo);
  const pts = h.map((p, i) => `${x(i).toFixed(1)},${y(p[1]).toFixed(1)}`);
  const base = s.codigo === "3685" ? y(0) : H;
  const id = "g" + s.codigo;
  const zero = s.codigo === "3685" ? `<line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-3)" stroke-dasharray="3 3" stroke-width="1"/>` : "";
  const ux = x(h.length - 1), uy = y(vals[vals.length - 1]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Evolução em 10 anos">
    <defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--${s.cor})" stop-opacity=".22"/><stop offset="1" stop-color="var(--${s.cor})" stop-opacity="0"/></linearGradient></defs>
    <path d="M${x(0)},${base} L${pts.join(" L")} L${ux},${base} Z" fill="url(#${id})"/>
    ${zero}
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--${s.cor})" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${ux}" cy="${uy}" r="3.5" fill="var(--${s.cor})" stroke="var(--sheet)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="spark-leg"><span>${h[0][0]}</span><span>10 anos</span><span>${h[h.length - 1][0]}</span></div>`;
}

function cartao(s) {
  const liq = s.codigo === "3685";
  const rot = liq ? (s.v > 0 ? "Devedor líquido" : "Credor líquido")
    : s.codigo === "25563" ? "DEB + intercompanhia + títulos domésticos"
    : `${fmt(s.v / S["25563"].v * 100)}% do conceito amplo`;
  return `<article class="cartao" style="--c:var(--${s.cor})">
    <div class="rotulo">${ico(s)}<div><div class="nome">${s.nome}</div><div class="cod">SGS ${s.codigo}</div></div></div>
    <div class="valor num">${sg(s.v).replace("+", liq ? "+" : "")}<small>US$ bi</small><span class="rot">${rot}</span></div>
    <div class="var2">${variacao("No ano", s.ano_abs, s.ano_pct, INFO.ref_ano)}${variacao("Em 12 meses", s.a12_abs, s.a12_pct, INFO.ref_12m)}</div>
    <div>${spark(s)}</div>
  </article>`;
}

function destaque() {
  const a = S["25563"], deb = S["3684"], it = S["7941"], tit = S["22160"], d2 = S["21554"];
  const tot = deb.v + it.v + tit.v;
  const w = (v) => (v / tot) * 100;
  const pos2 = w(deb.v) + w(it.v);
  const seg = (s) => `<div style="--c:var(--${s.cor});flex:${s.v}" title="${s.nome}">${fmt(s.v)}</div>`;
  const lg = (s) => `<div style="--c:var(--${s.cor})"><b>${s.curto}</b><span>${fmt(s.v)} bi · ${fmt(s.v / a.v * 100)}% do total</span><span>12 meses: ${sg(s.a12_abs)} bi (${sg(s.a12_pct)}%)</span></div>`;
  return `<section class="destaque">
    <div class="dest-num">
      <div class="rotulo">${ico(a)}<div><div class="nome">Dívida externa bruta · conceito amplo</div><div class="cod">SGS 25563 · inclui intercompanhia e títulos no mercado doméstico</div></div></div>
      <div class="grande num">${fmt(a.v)}<small>US$ bi</small></div>
      <div class="var2">${variacao("No ano", a.ano_abs, a.ano_pct, INFO.ref_ano)}${variacao("Em 12 meses", a.a12_abs, a.a12_pct, INFO.ref_12m)}</div>
    </div>
    <div class="comp">
      <h2>Composição do estoque em ${INFO.ref_label}</h2>
      <p class="sub">Conceito amplo = DEB + operações intercompanhia + títulos negociados no mercado doméstico</p>
      <div class="chave" aria-hidden="true">
        <div class="br" style="left:0;width:calc(${pos2}% - 1px)"></div>
        <div class="tx" style="left:${pos2 / 2}%">DEB + intercompanhia (SGS 21554): <b class="num">${fmt(d2.v)}</b></div>
      </div>
      <div class="barra" role="img" aria-label="DEB ${fmt(deb.v)}, intercompanhia ${fmt(it.v)}, títulos domésticos ${fmt(tit.v)} bilhões de dólares">${seg(deb)}${seg(it)}${seg(tit)}</div>
      <div class="leg">${lg(deb)}${lg(it)}${lg(tit)}</div>
    </div>
  </section>`;
}

function ranking() {
  const bloco = (kp, ka) => {
    const lista = INFO.series.filter((s) => s[kp] != null).sort((a, b) => b[kp] - a[kp]);
    const mx = Math.max(...INFO.series.filter((s) => s.a12_pct != null).map((s) => Math.abs(s.a12_pct)));
    return `<div class="rank">${lista.map((s) => `<div class="l" style="--c:var(--${s.cor})"><span>${s.curto}</span>
      <div class="tr"><div class="b" style="width:${(Math.abs(s[kp]) / mx) * 68}%"></div><span class="v num">${sg(s[kp])}%<small>${sg(s[ka])} bi</small></span></div></div>`).join("")}</div>`;
  };
  return `<section class="painel">
    <h2>Quem mais cresceu</h2>
    <p class="sub">Variação % com o acréscimo em US$ bi; barras na mesma escala</p>
    <h3>Em 12 meses · ${INFO.ref_12m} a ${INFO.ref}</h3>${bloco("a12_pct", "a12_abs")}
    <h3>No ano · ${INFO.ref_ano} a ${INFO.ref}</h3>${bloco("ano_pct", "ano_abs")}
  </section>`;
}

function liquida() {
  const s = S["3685"], h = INFO.liq_hist;
  const W = 620, H = 230, L = 40, R = 12, T = 18, B = 28;
  const vals = h.map((p) => p[1]);
  const lo = Math.floor(Math.min(...vals, 0) / 20) * 20, hi = Math.ceil(Math.max(...vals, 0) / 20) * 20 || 20;
  const y = (v) => T + ((hi - v) * (H - T - B)) / (hi - lo);
  const bw = (W - L - R) / h.length;
  let g = "";
  for (let v = lo; v <= hi; v += 20) g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="${v === 0 ? 0 : 1}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const bars = h.map((p, i) => {
    const x = L + i * bw + bw * 0.18, v = p[1], top = y(Math.max(v, 0)), hh = Math.abs(y(v) - y(0));
    const lbl = p[0].endsWith("T2") ? `<text x="${x + bw * 0.32}" y="${H - 8}" text-anchor="middle">${p[0].slice(0, 4)}</text>` : "";
    return `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${(bw * 0.64).toFixed(1)}" height="${Math.max(hh, 1).toFixed(1)}" rx="1.5" fill="var(--${v > 0 ? "pos" : "neg"})" opacity="${i === h.length - 1 ? 1 : 0.75}"/>${lbl}`;
  }).join("");
  const ux = L + (h.length - 1) * bw + bw / 2;
  const nota = `<text x="${ux - 8}" y="${y(s.v) - 8}" text-anchor="end" style="fill:var(--ink);font-weight:600">${INFO.ref}: +${fmt(s.v)}</text>`;
  return `<section class="painel liq" style="--c:var(--liq)">
    <h2>Dívida externa líquida: o Brasil voltou a ser devedor líquido</h2>
    <p class="sub">SGS 3685, US$ bi. Negativo = credor líquido (ativos externos superam a dívida); positivo = devedor líquido.</p>
    <div class="marco">
      <div><b class="num" style="color:var(--pos)">+${fmt(s.v)}</b><span>em ${INFO.ref}, 1º saldo devedor desde ${INFO.liq_ultimo_positivo}</span></div>
      <div><b class="num">${sg(s.ano_abs)}</b><span>no ano, vs. ${INFO.ref_ano} (${sg(INFO.liq_ref_ano)})</span></div>
      <div><b class="num">${sg(s.a12_abs)}</b><span>em 12 meses, vs. ${INFO.ref_12m} (${sg(INFO.liq_ref_12m)})</span></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dívida externa líquida trimestral, últimos ${h.length} trimestres">
      ${g}<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ink-2)" stroke-width="1.2"/>${bars}${nota}
    </svg>
  </section>`;
}

document.getElementById("app").innerHTML = `
  <header class="cab">
    <div><p class="olho">Infográfico · Setor externo · Banco Central do Brasil</p>
      <h1>Dívida externa do Brasil <span>na margem</span></h1></div>
    <div class="selo"><b>${INFO.ref_label}</b><small>Estoques de fim de período, US$ bilhões</small></div>
  </header>
  ${destaque()}
  <div class="secao"><h2>As seis séries em ${INFO.ref}</h2><p>No ano: vs. ${INFO.ref_ano} (dezembro). Em 12 meses: vs. ${INFO.ref_12m}.</p></div>
  <div class="grade">${["3684", "7941", "22160", "21554", "25563", "3685"].map((c) => cartao(S[c])).join("")}</div>
  <div class="duo">${ranking()}${liquida()}</div>
  <footer class="notas">
    <div><b>Fonte</b><p>Banco Central do Brasil, Sistema Gerenciador de Séries Temporais (SGS): séries 3684, 7941, 21554, 22160, 25563 e 3685. Dados até ${INFO.ref}, gerados em ${INFO.gerado}.</p></div>
    <div><b>Como ler as variações</b><p>São estoques trimestrais. "No ano" compara com o fim do ano anterior (${INFO.ref_ano}); "em 12 meses" compara com o mesmo trimestre do ano anterior (${INFO.ref_12m}).</p></div>
    <div><b>Dívida líquida</b><p>Como a base de comparação da série 3685 é negativa, a variação é mostrada só em US$ bi; a variação % não tem leitura econômica.</p></div>
  </footer>`;
</script>

</body>
</html>
